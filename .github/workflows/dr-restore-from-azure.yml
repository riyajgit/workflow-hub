name: DR - Restore from Azure Immutable Backup

# PURPOSE: Downloads git bundles for selected repos from Azure Blob Storage and
#          pushes them to a target Azure DevOps org (or GitHub org).
#          Use this after a cyber attack, accidental deletion, or org migration.
#
# HOW GIT BUNDLES WORK:
#   A .bundle file is a portable snapshot of a full git repository — all commits,
#   branches, tags, and history. "git bundle unbundle" reconstructs the repo from
#   the file without needing the original remote to be alive.
#
# INPUTS:
#   backup_date     - Which Sunday backup to restore from  e.g. "2026-06-15"
#   restore_target  - "ado" (restore to Azure DevOps) or "github" (restore to GitHub)
#   target_org      - Destination org/owner name
#   repos_filter    - Optional comma-separated repo names to restore a subset
#                     Leave blank to restore ALL repos from that backup date
#
# SECRETS REQUIRED:
#   AZURE_STORAGE_ACCOUNT    - Storage account name
#   AZURE_STORAGE_CONTAINER  - Container name  e.g. "dr-immutable-backups"
#   AZURE_SAS_TOKEN          - SAS token (Read + List permissions minimum)
#   ADO_PAT                  - Required if restore_target = ado
#                              Needs: Code (Read & Write), Project (Read & Write)
#   GH_PAT                   - Required if restore_target = github
#                              Needs: repo scope

on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: 'Backup date to restore from (YYYY-MM-DD)'
        required: true
        type: string
      restore_target:
        description: 'Restore destination'
        required: true
        type: choice
        options:
          - ado
          - github
      target_org:
        description: 'Destination org/owner (ADO org name or GitHub owner)'
        required: true
        type: string
      repos_filter:
        description: 'Comma-separated repo names to restore (blank = restore all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — download bundles and verify but do not push'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: dr-restore
  cancel-in-progress: false   # never cancel a restore mid-flight

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Validate inputs and secrets ──────────────────────────────────────
      - name: Validate inputs and secrets
        env:
          AZURE_STORAGE_ACCOUNT:   ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          AZURE_SAS_TOKEN:         ${{ secrets.AZURE_SAS_TOKEN }}
          ADO_PAT:                 ${{ secrets.ADO_PAT }}
          GH_PAT:                  ${{ secrets.GH_PAT }}
          TARGET:                  ${{ github.event.inputs.restore_target }}
          TARGET_ORG:              ${{ github.event.inputs.target_org }}
          BACKUP_DATE:             ${{ github.event.inputs.backup_date }}
        run: |
          MISSING=""
          [ -z "$AZURE_STORAGE_ACCOUNT" ]   && MISSING="$MISSING AZURE_STORAGE_ACCOUNT"
          [ -z "$AZURE_STORAGE_CONTAINER" ] && MISSING="$MISSING AZURE_STORAGE_CONTAINER"
          [ -z "$AZURE_SAS_TOKEN" ]         && MISSING="$MISSING AZURE_SAS_TOKEN"
          [ "$TARGET" = "ado"    ] && [ -z "$ADO_PAT" ] && MISSING="$MISSING ADO_PAT"
          [ "$TARGET" = "github" ] && [ -z "$GH_PAT" ]  && MISSING="$MISSING GH_PAT"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

          # Validate date format YYYY-MM-DD
          if ! echo "$BACKUP_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::backup_date must be in YYYY-MM-DD format, got: $BACKUP_DATE"
            exit 1
          fi

          [ -z "$TARGET_ORG" ] && { echo "::error::target_org is required"; exit 1; }

          echo "Restore target : $TARGET / $TARGET_ORG"
          echo "Backup date    : $BACKUP_DATE"
          echo "Filter         : ${REPOS_FILTER:-(all repos)}"
          echo "Dry run        : ${{ github.event.inputs.dry_run }}"
          echo "All secrets present."

      # ── List available bundles from Azure Blob Storage ───────────────────
      - name: List blobs for backup date
        id: list-blobs
        env:
          AZURE_STORAGE_ACCOUNT:   ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          AZURE_SAS_TOKEN:         ${{ secrets.AZURE_SAS_TOKEN }}
          BACKUP_DATE:             ${{ github.event.inputs.backup_date }}
        run: |
          BLOB_BASE="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net"
          # List all blobs under the date prefix using Azure List Blobs REST API
          # URL-encode the prefix in case project names contain spaces
          PREFIX_ENC=$(printf '%s/' "$BACKUP_DATE" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe='/'))")
          LIST_URL="${BLOB_BASE}/${AZURE_STORAGE_CONTAINER}?restype=container&comp=list&prefix=${PREFIX_ENC}&${AZURE_SAS_TOKEN}"

          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/blob-list.xml "$LIST_URL")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Failed to list blobs -- HTTP $HTTP"
            echo "         Check AZURE_SAS_TOKEN has List permission."
            cat /tmp/blob-list.xml
            exit 1
          fi

          # Extract blob names from XML response (only .bundle files)
          BUNDLES=$(grep -oP '(?<=<Name>)[^<]+\.bundle(?=</Name>)' /tmp/blob-list.xml || true)
          COUNT=$(echo "$BUNDLES" | grep -c '\.bundle' || true)

          if [ -z "$BUNDLES" ] || [ "$COUNT" -eq 0 ]; then
            echo "::error::No .bundle files found under prefix '${BACKUP_DATE}/' in container '${AZURE_STORAGE_CONTAINER}'."
            echo "Available backups — check your storage container for valid dates."
            exit 1
          fi

          echo "Found $COUNT bundle(s) for $BACKUP_DATE:"
          echo "$BUNDLES" | while read -r b; do echo "  $b"; done

          # Write list to file for use in next step
          echo "$BUNDLES" > /tmp/bundle-list.txt
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # ── Download, unbundle and push each repo ───────────────────────────
      - name: Download and restore repos
        id: restore
        env:
          AZURE_STORAGE_ACCOUNT:   ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          AZURE_SAS_TOKEN:         ${{ secrets.AZURE_SAS_TOKEN }}
          ADO_PAT:                 ${{ secrets.ADO_PAT }}
          GH_PAT:                  ${{ secrets.GH_PAT }}
          TARGET:                  ${{ github.event.inputs.restore_target }}
          TARGET_ORG:              ${{ github.event.inputs.target_org }}
          REPOS_FILTER:            ${{ github.event.inputs.repos_filter }}
          BACKUP_DATE:             ${{ github.event.inputs.backup_date }}
          DRY_RUN:                 ${{ github.event.inputs.dry_run }}
        run: |
          BLOB_BASE="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}"
          WORK_DIR="/tmp/restore-work"
          mkdir -p "$WORK_DIR"

          SUCCESS=0
          FAILED=0
          SKIPPED=0
          RESULTS=""

          # Build filter set (lowercase for case-insensitive match)
          FILTER_SET=""
          if [ -n "$REPOS_FILTER" ]; then
            FILTER_SET=$(printf '%s' "$REPOS_FILTER" | python3 -c "
import sys
items = [x.strip().lower() for x in sys.stdin.read().split(',') if x.strip()]
print(' '.join(items))
")
            echo "Filtering to repos: $FILTER_SET"
          fi

          while IFS= read -r BLOB_PATH; do
            # Extract org, project, repo from path: YYYY-MM-DD/org/project/repo.bundle
            REPO=$(basename "$BLOB_PATH" .bundle)
            PROJECT=$(basename "$(dirname "$BLOB_PATH")")
            ORG=$(basename "$(dirname "$(dirname "$BLOB_PATH")")")

            echo ""
            echo "-- $ORG / $PROJECT / $REPO --"

            # Apply filter if set
            if [ -n "$FILTER_SET" ]; then
              REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
              MATCH=""
              for f in $FILTER_SET; do
                [ "$REPO_LOWER" = "$f" ] && MATCH=1 && break
              done
              if [ -z "$MATCH" ]; then
                echo "  skipped (not in repos_filter)"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi
            fi

            # ── Download bundle from Azure Blob ────────────────────────────
            BUNDLE_FILE="$WORK_DIR/${ORG}_${PROJECT}_${REPO}.bundle"
            # URL-encode the blob path so spaces in project names don't break the URL
            BLOB_PATH_ENC=$(printf '%s' "$BLOB_PATH" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe='/'))")
            HTTP=$(curl -sS -w "%{http_code}" -o "$BUNDLE_FILE" \
              "${BLOB_BASE}/${BLOB_PATH_ENC}?${AZURE_SAS_TOKEN}")

            if [ "$HTTP" != "200" ]; then
              echo "  FAIL: download returned HTTP $HTTP"
              FAILED=$((FAILED + 1))
              RESULTS="${RESULTS}| $ORG/$PROJECT/$REPO | download failed (HTTP $HTTP) |\n"
              continue
            fi

            SIZE=$(du -sh "$BUNDLE_FILE" | cut -f1)
            echo "  downloaded: $SIZE"

            # ── Verify bundle integrity ─────────────────────────────────────
            if ! git bundle verify "$BUNDLE_FILE" 2>&1; then
              echo "  FAIL: bundle verification failed"
              FAILED=$((FAILED + 1))
              RESULTS="${RESULTS}| $ORG/$PROJECT/$REPO | bundle corrupt |\n"
              continue
            fi
            echo "  bundle verified OK"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  DRY RUN -- skipping push"
              SUCCESS=$((SUCCESS + 1))
              RESULTS="${RESULTS}| $ORG/$PROJECT/$REPO | dry run OK ($SIZE) |\n"
              continue
            fi

            # ── Unbundle into a local bare repo ────────────────────────────
            CLONE_DIR="$WORK_DIR/${ORG}_${PROJECT}_${REPO}.git"
            git init --bare "$CLONE_DIR"
            if ! git -C "$CLONE_DIR" bundle unbundle "$BUNDLE_FILE" 2>&1; then
              echo "  FAIL: unbundle failed"
              FAILED=$((FAILED + 1))
              RESULTS="${RESULTS}| $ORG/$PROJECT/$REPO | unbundle failed |\n"
              continue
            fi
            # Set HEAD to the first available branch
            FIRST_BRANCH=$(git -C "$CLONE_DIR" branch | grep -v HEAD | head -1 | tr -d ' *')
            [ -n "$FIRST_BRANCH" ] && git -C "$CLONE_DIR" symbolic-ref HEAD "refs/heads/$FIRST_BRANCH"

            # ── Push to restore target ──────────────────────────────────────
            TARGET_ORG_ENC=$(printf '%s' "$TARGET_ORG" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(),safe=''))")
            PROJ_ENC=$(printf '%s' "$PROJECT" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(),safe=''))")
            REPO_ENC=$(printf '%s' "$REPO"    | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(),safe=''))")

            if [ "$TARGET" = "ado" ]; then
              PUSH_URL="https://:${ADO_PAT}@dev.azure.com/${TARGET_ORG_ENC}/${PROJ_ENC}/_git/${REPO_ENC}"
            else
              PUSH_URL="https://x-access-token:${GH_PAT}@github.com/${TARGET_ORG_ENC}/${REPO_ENC}.git"
            fi

            echo "  pushing all refs to $TARGET / $TARGET_ORG / $REPO ..."
            if git -c credential.helper='' -C "$CLONE_DIR" push --mirror "$PUSH_URL" 2>&1; then
              BRANCHES=$(git -C "$CLONE_DIR" branch | wc -l | tr -d ' ')
              echo "  ok: restored $REPO ($BRANCHES branch(es))"
              SUCCESS=$((SUCCESS + 1))
              RESULTS="${RESULTS}| $ORG/$PROJECT/$REPO | restored ($BRANCHES branches) |\n"
            else
              echo "  FAIL: push failed for $REPO"
              echo "        For ADO: verify repo exists in target project and PAT has Code - Write scope."
              echo "        For GitHub: verify repo exists and GH_PAT has repo scope."
              FAILED=$((FAILED + 1))
              RESULTS="${RESULTS}| $ORG/$PROJECT/$REPO | push failed |\n"
            fi

            # Clean up local work files
            rm -rf "$CLONE_DIR" "$BUNDLE_FILE"

          done < /tmp/bundle-list.txt

          echo ""
          echo "Restore complete: $SUCCESS ok, $FAILED failed, $SKIPPED skipped"

          echo "success=$SUCCESS"   >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED"     >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED"   >> "$GITHUB_OUTPUT"
          {
            echo "RESULTS<<RESEOF"
            printf '%b' "$RESULTS"
            echo "RESEOF"
          } >> "$GITHUB_ENV"

          # Fail the job if every attempted repo failed
          ATTEMPTED=$((SUCCESS + FAILED))
          [ "$ATTEMPTED" -gt 0 ] && [ "$SUCCESS" -eq 0 ] && {
            echo "::error::All restore attempts failed."
            exit 1
          }

      # ── Step summary ─────────────────────────────────────────────────────
      - name: Write step summary
        if: always()
        env:
          BACKUP_DATE:   ${{ github.event.inputs.backup_date }}
          TARGET:        ${{ github.event.inputs.restore_target }}
          TARGET_ORG:    ${{ github.event.inputs.target_org }}
          FILTER:        ${{ github.event.inputs.repos_filter }}
          DRY_RUN:       ${{ github.event.inputs.dry_run }}
          BLOB_COUNT:    ${{ steps.list-blobs.outputs.count }}
          SUCCESS:       ${{ steps.restore.outputs.success }}
          FAILED:        ${{ steps.restore.outputs.failed }}
          SKIPPED:       ${{ steps.restore.outputs.skipped }}
        run: |
          {
            echo "## DR Restore from Azure Immutable Backup"
            echo ""
            [ "$DRY_RUN" = "true" ] && echo "> **DRY RUN** -- no repos were pushed." && echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Backup date | $BACKUP_DATE |"
            echo "| Restore target | $TARGET / $TARGET_ORG |"
            echo "| Filter | ${FILTER:-(all)} |"
            echo "| Bundles found in Azure | ${BLOB_COUNT:-0} |"
            echo "| Restored successfully | ${SUCCESS:-0} |"
            echo "| Failed | ${FAILED:-0} |"
            echo "| Skipped (filter) | ${SKIPPED:-0} |"
            echo ""
            if [ -n "$RESULTS" ]; then
              echo "### Results"
              echo "| Repo | Status |"
              echo "|---|---|"
              printf '%b' "$RESULTS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
