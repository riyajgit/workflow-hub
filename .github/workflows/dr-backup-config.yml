name: DR - Backup ADO Configuration

# PURPOSE: Exports non-repo Azure DevOps project components to versioned JSON files
#          AND mirrors wiki content (Git repos) to private GitHub backup repos.
#          Captures classic pipelines, release pipelines, variable groups,
#          service connections, environments, dashboards, wiki content, and agent pools.
#
# NOTE ON SECRETS: ADO masks secret variable values and service connection credentials
#          by design — they will NOT appear in the exported JSON. This is expected.
#
# WIKI CONTENT: ADO wikis are hidden Git repos. This workflow clones each wiki and
#          pushes it to a private GitHub repo named {wiki-name}_backup.
#          View backed-up wiki: github.com/{owner}/{wiki-name}_backup
#
# OUTPUT:
#   dr-config-backup/{org}/{project}/*.json   ← full JSON exports (repo root)
#   docs/dr-config-backup/{org}/{project}/    ← manifest + wiki list for portal
#   github.com/{owner}/{wiki-name}_backup     ← full wiki content (Git mirror)
#
# SCHEDULED: Daily at 18:30 UTC (30 min after dr-mirror.yml finishes)
# MANUAL:    workflow_dispatch — specify ado_org and ado_project to target any project

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      ado_org:
        description: Azure DevOps organization name (leave blank to use repos.json)
        required: false
        default: ''
        type: string
      ado_project:
        description: Azure DevOps project name (leave blank to use repos.json)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: dr-backup-config
  cancel-in-progress: false   # Never cancel an in-progress backup

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          if [ -z "$ADO_PAT" ]; then
            echo "ERROR: ADO_PAT secret is missing."
            echo "Add it at: Settings → Secrets → Actions → ADO_PAT"
            exit 1
          fi
          echo "ADO_PAT present."

      - name: Resolve ADO org and project
        env:
          INPUT_ORG:     ${{ github.event.inputs.ado_org }}
          INPUT_PROJECT: ${{ github.event.inputs.ado_project }}
        run: |
          if [ -n "$INPUT_ORG" ] && [ -n "$INPUT_PROJECT" ]; then
            ADO_ORG="$INPUT_ORG"
            ADO_PROJECT="$INPUT_PROJECT"
            echo "Source: workflow_dispatch inputs."
          elif [ -f "repos.json" ]; then
            ADO_ORG=$(jq -r 'map(select(.ado_org != null)) | .[0].ado_org // empty' repos.json)
            ADO_PROJECT=$(jq -r 'map(select(.ado_project != null)) | .[0].ado_project // empty' repos.json)
            echo "Source: repos.json (first entry)."
          fi

          if [ -z "$ADO_ORG" ] || [ -z "$ADO_PROJECT" ]; then
            echo "ERROR: Cannot determine ADO org/project."
            echo "Provide ado_org + ado_project inputs, or ensure repos.json has at least one entry."
            exit 1
          fi

          echo "Target: $ADO_ORG / $ADO_PROJECT"
          echo "ADO_ORG=$ADO_ORG"         >> "$GITHUB_ENV"
          echo "ADO_PROJECT=$ADO_PROJECT" >> "$GITHUB_ENV"

      - name: URL-encode org and project for API URLs
        run: |
          ORG_ENC=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['ADO_ORG'], safe=''))")
          PROJ_ENC=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['ADO_PROJECT'], safe=''))")
          echo "ADO_ORG_ENC=$ORG_ENC"     >> "$GITHUB_ENV"
          echo "ADO_PROJECT_ENC=$PROJ_ENC" >> "$GITHUB_ENV"
          echo "Encoded: '$ADO_ORG' → '$ORG_ENC' / '$ADO_PROJECT' → '$PROJ_ENC'"

      - name: Pre-flight — verify ADO connectivity and PAT scopes
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          echo "=== ADO pre-flight check: $ADO_ORG / $ADO_PROJECT ==="
          FAIL=0

          # ── 1. Org reachable? (needs any valid PAT) ────────────────────
          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/pf-projects.json \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/_apis/projects?api-version=7.1")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Cannot reach ADO org '$ADO_ORG' — HTTP $HTTP"
            echo "         Response: $(head -c 400 /tmp/pf-projects.json)"
            echo ""
            echo "Possible causes:"
            echo "  • ADO_PAT secret is missing, expired, or revoked"
            echo "  • Organization name '$ADO_ORG' is wrong"
            echo "  • PAT was created in a different AAD tenant"
            exit 1
          fi
          echo "✓ Org reachable (HTTP 200)"

          # Confirm the project exists in this org
          PROJECT_FOUND=$(jq -r --arg p "$ADO_PROJECT" '.value[] | select(.name == $p) | .name' /tmp/pf-projects.json)
          if [ -z "$PROJECT_FOUND" ]; then
            echo "::error::Project '$ADO_PROJECT' not found in org '$ADO_ORG'."
            echo "Available projects:"
            jq -r '.value[].name' /tmp/pf-projects.json | sed 's/^/  - /'
            exit 1
          fi
          echo "✓ Project '$ADO_PROJECT' found"

          # ── 2. Check each required API scope ──────────────────────────
          check_scope() {
            local LABEL="$1" URL="$2" FILE="$3"
            local H
            H=$(curl -sS -w "%{http_code}" -o "$FILE" -u ":$ADO_PAT" "$URL")
            if [ "$H" = "200" ]; then
              echo "✓ $LABEL (HTTP 200)"
            elif [ "$H" = "401" ] || [ "$H" = "403" ]; then
              echo "::warning::$LABEL — HTTP $H (PAT missing this scope)"
              echo "  Response: $(head -c 200 "$FILE")"
              FAIL=1
            else
              echo "::warning::$LABEL — HTTP $H"
              echo "  Response: $(head -c 200 "$FILE")"
            fi
          }

          # ── Scope checks — only Wiki is active; others re-enable as PAT scopes are added ──
          # TODO: uncomment when PAT has Build — Read
          # check_scope "Build (Read)" \
          #   "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/build/definitions?api-version=7.1&$top=1" \
          #   /tmp/pf-build.json
          # TODO: uncomment when PAT has Release — Read
          # check_scope "Release (Read)" \
          #   "https://vsrm.dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/release/definitions?api-version=7.1&$top=1" \
          #   /tmp/pf-release.json
          # TODO: uncomment when PAT has Variable Groups — Read
          # check_scope "Variable Groups (Read)" \
          #   "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/distributedtask/variablegroups?api-version=7.1&$top=1" \
          #   /tmp/pf-vg.json
          # TODO: uncomment when PAT has Service Connections — Read
          # check_scope "Service Connections (Read)" \
          #   "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/serviceendpoint/endpoints?api-version=7.1&$top=1" \
          #   /tmp/pf-sc.json
          # TODO: uncomment when PAT has Environments — Read
          # check_scope "Environments (Read)" \
          #   "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/distributedtask/environments?api-version=7.1&$top=1" \
          #   /tmp/pf-env.json
          # TODO: uncomment when PAT has Dashboards — Read
          # check_scope "Dashboards (Read)" \
          #   "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/dashboard/dashboards?api-version=7.1" \
          #   /tmp/pf-dash.json
          check_scope "Wiki (Read)"            \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/wiki/wikis?api-version=7.1" \
            /tmp/pf-wiki.json
          check_scope "Agent Pools (Read)"     \
            "https://dev.azure.com/$ADO_ORG_ENC/_apis/distributedtask/pools?api-version=7.1" \
            /tmp/pf-pools.json
          check_scope "Branch Policies (Read)" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/policy/configurations?api-version=7.1&\$top=1" \
            /tmp/pf-policy.json
          # TODO: uncomment when PAT has Work Items — Read
          # check_scope "Work Item Types (Read)" \
          #   "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/wit/workitemtypes?api-version=7.1" \
          #   /tmp/pf-wit.json

          echo ""
          if [ "$FAIL" = "1" ]; then
            echo "::error::One or more required PAT scopes are missing."
            echo "ADO_PAT currently needs:"
            echo "  • Wiki — Read & write"
            echo "  • Agent Pools — Read"
            echo "  • Code — Read  (for wiki content clone + branch policies)"
            echo "Then update the ADO_PAT secret in GitHub Settings → Secrets → Actions."
            exit 1
          fi
          echo "=== Scope checks passed — proceeding with wiki backup ==="

      - name: Create backup directories
        run: |
          BACKUP_DIR="dr-config-backup/$ADO_ORG/$ADO_PROJECT"
          DOCS_DIR="docs/dr-config-backup/$ADO_ORG/$ADO_PROJECT"
          mkdir -p "$BACKUP_DIR" "$DOCS_DIR"
          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"
          echo "DOCS_DIR=$DOCS_DIR"     >> "$GITHUB_ENV"
          echo "Backup dir : $BACKUP_DIR"
          echo "Portal dir : $DOCS_DIR"

      # ── Component exports ─────────────────────────────────────────────────
      # Each step saves raw JSON and sets a *_COUNT env var for the manifest.
      # Non-200 responses are treated as "0 items" (project may not use that feature).

      - name: Export build pipeline definitions
        if: false   # TODO: enable when ADO_PAT has Build — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/build-pipelines.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/build/definitions?api-version=7.1&includeAllProperties=true")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/build-pipelines.json")
            echo "Build pipelines: $COUNT"
          else
            echo "::warning::Build pipeline API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/build-pipelines.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/build-pipelines.json"
            COUNT=0
          fi
          echo "BUILD_PIPELINE_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Export release pipeline definitions
        if: false   # TODO: enable when ADO_PAT has Release — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          # Release API uses vsrm.dev.azure.com (different subdomain from the rest)
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/release-pipelines.json" \
            -u ":$ADO_PAT" \
            "https://vsrm.dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/release/definitions?api-version=7.1&\$expand=all")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/release-pipelines.json")
            echo "Release pipelines: $COUNT"
          else
            echo "::warning::Release pipeline API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/release-pipelines.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/release-pipelines.json"
            COUNT=0
          fi
          echo "RELEASE_PIPELINE_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Export variable groups
        if: false   # TODO: enable when ADO_PAT has Variable Groups — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/variable-groups.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/distributedtask/variablegroups?api-version=7.1")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/variable-groups.json")
            echo "Variable groups: $COUNT (secret values masked by ADO — expected)"
          else
            echo "::warning::Variable groups API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/variable-groups.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/variable-groups.json"
            COUNT=0
          fi
          echo "VARIABLE_GROUP_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Export service connections
        if: false   # TODO: enable when ADO_PAT has Service Connections — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/service-connections.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/serviceendpoint/endpoints?api-version=7.1")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/service-connections.json")
            echo "Service connections: $COUNT (credentials excluded by ADO)"
          else
            echo "::warning::Service connections API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/service-connections.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/service-connections.json"
            COUNT=0
          fi
          echo "SERVICE_CONNECTION_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Export environments
        if: false   # TODO: enable when ADO_PAT has Environments — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/environments.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/distributedtask/environments?api-version=7.1")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/environments.json")
            echo "Environments: $COUNT"
          else
            echo "::warning::Environments API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/environments.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/environments.json"
            COUNT=0
          fi
          echo "ENVIRONMENT_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Export dashboards
        if: false   # TODO: enable when ADO_PAT has Dashboards — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/dashboards.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/dashboard/dashboards?api-version=7.1")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/dashboards.json")
            echo "Dashboards: $COUNT"
          else
            echo "::warning::Dashboards API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/dashboards.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/dashboards.json"
            COUNT=0
          fi
          echo "DASHBOARD_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Export branch policies
        if: false   # TODO: enable when ADO_PAT has Policy — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/branch-policies.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/policy/configurations?api-version=7.1")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/branch-policies.json")
            echo "Branch policies: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              jq -r '.value[] | "  - [" + (.type.displayName // .type.id) + "]"' \
                "$BACKUP_DIR/branch-policies.json" 2>/dev/null | sort -u | head -20
            fi
          else
            echo "::warning::Branch policies API returned HTTP $HTTP — response: $(head -c 300 \"$BACKUP_DIR/branch-policies.json\")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/branch-policies.json"
            COUNT=0
          fi
          echo "BRANCH_POLICY_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Export work items
        if: false   # TODO: enable when ADO_PAT has Work Items — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          # Step 1: Get all work item IDs via WIQL
          WIQL_HTTP=$(curl -sS -w "%{http_code}" -o /tmp/wi-ids.json \
            -X POST \
            -H "Content-Type: application/json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/wit/wiql?api-version=7.1" \
            -d '{"query":"SELECT [System.Id] FROM WorkItems ORDER BY [System.Id] ASC"}')
          if [ "$WIQL_HTTP" != "200" ]; then
            echo "::warning::Work items WIQL returned HTTP $WIQL_HTTP — skipping work items export"
            echo '{"count":0,"value":[]}' > "$BACKUP_DIR/work-items.json"
            echo "WORK_ITEM_COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi

          TOTAL=$(jq '.workItems | length' /tmp/wi-ids.json)
          echo "Work items found: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo '{"count":0,"value":[]}' > "$BACKUP_DIR/work-items.json"
            echo "WORK_ITEM_COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi

          [ "$TOTAL" -gt 5000 ] && echo "::warning::Large work item set ($TOTAL items) — backup may take several minutes."

          # Step 2: Batch fetch work item details in groups of 200 (API max per call).
          # Uses temp file accumulation to avoid shell variable size limits.
          BATCH_SIZE=200
          OFFSET=0
          echo "[]" > /tmp/wi-accumulated.json

          while [ "$OFFSET" -lt "$TOTAL" ]; do
            BATCH_IDS=$(jq --argjson o "$OFFSET" --argjson s "$BATCH_SIZE" \
              '[.workItems[$o:$o+$s][].id]' /tmp/wi-ids.json)
            BATCH_PAYLOAD=$(jq -cn \
              --argjson ids "$BATCH_IDS" \
              '{ids: $ids,
                fields: ["System.Id","System.Title","System.WorkItemType","System.State",
                         "System.AssignedTo","System.CreatedDate","System.ChangedDate",
                         "System.Tags","Microsoft.VSTS.Common.Priority","System.Description",
                         "System.AreaPath","System.IterationPath"],
                errorPolicy: "omit"}')

            BATCH_HTTP=$(curl -sS -w "%{http_code}" -o /tmp/wi-batch.json \
              -X POST \
              -H "Content-Type: application/json" \
              -u ":$ADO_PAT" \
              "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/wit/workitemsbatch?api-version=7.1" \
              -d "$BATCH_PAYLOAD")

            if [ "$BATCH_HTTP" = "200" ]; then
              jq '.value' /tmp/wi-batch.json > /tmp/wi-batch-items.json
              jq -s 'add' /tmp/wi-accumulated.json /tmp/wi-batch-items.json \
                > /tmp/wi-accumulated.tmp && mv /tmp/wi-accumulated.tmp /tmp/wi-accumulated.json
              echo "  Fetched items $OFFSET–$((OFFSET + BATCH_SIZE - 1)) (HTTP 200)"
            else
              echo "::warning::Work items batch HTTP $BATCH_HTTP at offset $OFFSET — skipping batch"
            fi
            OFFSET=$((OFFSET + BATCH_SIZE))
          done

          jq -n \
            --argjson count "$TOTAL" \
            --slurpfile items /tmp/wi-accumulated.json \
            '{count: $count, value: $items[0]}' > "$BACKUP_DIR/work-items.json"
          echo "WORK_ITEM_COUNT=$TOTAL" >> "$GITHUB_ENV"
          echo "Work items export complete: $TOTAL items → $BACKUP_DIR/work-items.json"

      - name: Export wiki repos
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/wiki-repos.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_apis/wiki/wikis?api-version=7.1")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/wiki-repos.json")
            echo "Wiki repos: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "Wikis found:"
              jq -r '.value[] | "  - " + .name + " (" + .type + ")"' "$BACKUP_DIR/wiki-repos.json"
            fi
          else
            echo "::warning::Wiki API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/wiki-repos.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/wiki-repos.json"
            COUNT=0
          fi
          echo "WIKI_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Mirror wiki content to GitHub backup repos
        # ADO wikis are Git repos — clone each one and push to a private GitHub backup repo.
        # Content is stored at: github.com/{owner}/{wiki-name}_backup
        env:
          ADO_PAT:  ${{ secrets.ADO_PAT }}
          GH_PAT:   ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # needed by the gh CLI
        run: |
          WIKI_COUNT_VAL=$(jq '.value | length' "$BACKUP_DIR/wiki-repos.json" 2>/dev/null || echo 0)
          if [ "$WIKI_COUNT_VAL" -eq 0 ]; then
            echo "No wikis to mirror — skipping."
            exit 0
          fi

          if [ -z "$GH_PAT" ]; then
            echo "WARNING: GH_PAT secret not set."
            echo "Wiki metadata has been saved, but content cannot be mirrored without GH_PAT."
            echo "Add GH_PAT (with repo + workflow scopes) to enable full wiki content backup."
            exit 0
          fi

          GH_OWNER="${{ github.repository_owner }}"
          echo "Mirroring $WIKI_COUNT_VAL wiki repo(s) to github.com/$GH_OWNER ..."
          WIKI_MIRROR_RESULTS=""

          while IFS= read -r WIKI_NAME; do
            WIKI_TYPE=$(jq -r --arg n "$WIKI_NAME" \
              '.value[] | select(.name == $n) | .type' \
              "$BACKUP_DIR/wiki-repos.json")

            # The ADO Wiki API returns a web browse URL in remoteUrl (GUID-based),
            # NOT the git clone URL. Build the correct git URL from org/project/name.
            #   projectWiki → https://dev.azure.com/{org}/{project}/_git/{wiki.name}
            #   codeWiki    → same pattern; the wiki folder lives inside that repo
            WIKI_NAME_ENC=$(python3 -c \
              "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" \
              "$WIKI_NAME")
            GIT_URL="https://dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_git/$WIKI_NAME_ENC"
            ADO_CLONE_URL="https://:${ADO_PAT}@dev.azure.com/$ADO_ORG_ENC/$ADO_PROJECT_ENC/_git/$WIKI_NAME_ENC"

            # GitHub backup repo name: ProjectName.wiki → ProjectName.wiki_backup
            BACKUP_REPO="${WIKI_NAME}_backup"

            echo ""
            echo "── $WIKI_NAME ($WIKI_TYPE) ──"
            echo "   Source : $GIT_URL"
            echo "   Target : github.com/$GH_OWNER/$BACKUP_REPO"

            # Create GitHub backup repo if it does not already exist
            gh repo create "$GH_OWNER/$BACKUP_REPO" \
              --private \
              --description "DR wiki backup — ADO: $ADO_ORG/$ADO_PROJECT/$WIKI_NAME" \
            && echo "   Created GitHub repo." \
            || echo "   Repo already exists — syncing."

            # Clone wiki as a bare mirror from ADO.
            # Use -c credential.helper='' to prevent the GitHub Actions runner's
            # git credential helper (set via GH_TOKEN) from intercepting ADO HTTPS
            # requests and replacing the embedded ADO_PAT with GitHub credentials.
            CLONE_DIR="wiki-clone-$(echo "$WIKI_NAME" | tr '/' '-' | tr ' ' '_')"
            if git -c credential.helper='' clone --mirror "$ADO_CLONE_URL" "$CLONE_DIR" 2>&1; then
              # Push all branches and tags to GitHub backup
              git -C "$CLONE_DIR" push --force \
                "https://x-access-token:$GH_PAT@github.com/$GH_OWNER/${BACKUP_REPO}.git" \
                '+refs/heads/*:refs/heads/*' \
                '+refs/tags/*:refs/tags/*'
              echo "   ✓ Content mirrored → github.com/$GH_OWNER/$BACKUP_REPO"
              WIKI_MIRROR_RESULTS="$WIKI_MIRROR_RESULTS\n✅ $WIKI_NAME → $BACKUP_REPO"
            else
              echo "   ✗ Clone failed — URL: $GIT_URL"
              echo "   Possible causes: wiki has no pages yet, or ADO_PAT is missing Code — Read scope"
              WIKI_MIRROR_RESULTS="$WIKI_MIRROR_RESULTS\n⚠️ $WIKI_NAME — clone failed (no pages yet, or PAT missing Code-Read)"
            fi
          done < <(jq -r '.value[].name' "$BACKUP_DIR/wiki-repos.json")

          echo ""
          echo "Wiki mirror summary:"
          echo -e "$WIKI_MIRROR_RESULTS"
          echo "WIKI_MIRROR_RESULTS<<EOF" >> "$GITHUB_ENV"
          echo -e "$WIKI_MIRROR_RESULTS"  >> "$GITHUB_ENV"
          echo "EOF"                       >> "$GITHUB_ENV"

      - name: Export agent pools (org-level)
        if: false   # TODO: enable when ADO_PAT has Agent Pools — Read scope
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          # Agent pools are org-scoped — no project segment in the URL
          HTTP=$(curl -sS -w "%{http_code}" -o "$BACKUP_DIR/agent-pools.json" \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG_ENC/_apis/distributedtask/pools?api-version=7.1")
          if [ "$HTTP" = "200" ]; then
            COUNT=$(jq '.count // (.value | length) // 0' "$BACKUP_DIR/agent-pools.json")
            echo "Agent pools: $COUNT"
            jq -r '.value[] | "  - " + .name + " (" + .poolType + ")"' "$BACKUP_DIR/agent-pools.json"
          else
            echo "::warning::Agent pools API returned HTTP $HTTP — response: $(head -c 300 "$BACKUP_DIR/agent-pools.json")"
            echo '{"value":[],"count":0}' > "$BACKUP_DIR/agent-pools.json"
            COUNT=0
          fi
          echo "AGENT_POOL_COUNT=$COUNT" >> "$GITHUB_ENV"

      # ── Manifest + portal files ───────────────────────────────────────────

      - name: Write backup manifest
        run: |
          BACKED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GH_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg org                "$ADO_ORG" \
            --arg project            "$ADO_PROJECT" \
            --arg ts                 "$BACKED_AT" \
            --arg actor              "${{ github.actor }}" \
            --arg gh_repo            "${{ github.repository }}" \
            --arg run_url            "$GH_RUN_URL" \
            --argjson build_pipelines     "${BUILD_PIPELINE_COUNT:-0}" \
            --argjson release_pipelines   "${RELEASE_PIPELINE_COUNT:-0}" \
            --argjson variable_groups     "${VARIABLE_GROUP_COUNT:-0}" \
            --argjson service_connections "${SERVICE_CONNECTION_COUNT:-0}" \
            --argjson environments        "${ENVIRONMENT_COUNT:-0}" \
            --argjson dashboards          "${DASHBOARD_COUNT:-0}" \
            --argjson branch_policies     "${BRANCH_POLICY_COUNT:-0}" \
            --argjson work_items          "${WORK_ITEM_COUNT:-0}" \
            --argjson wiki_repos          "${WIKI_COUNT:-0}" \
            --argjson agent_pools         "${AGENT_POOL_COUNT:-0}" \
            '{
              ado_org:     $org,
              ado_project: $project,
              backed_up_at: $ts,
              backed_up_by: $actor,
              github_repo:  $gh_repo,
              run_url:      $run_url,
              components: {
                build_pipelines:     $build_pipelines,
                release_pipelines:   $release_pipelines,
                variable_groups:     $variable_groups,
                service_connections: $service_connections,
                environments:        $environments,
                dashboards:          $dashboards,
                branch_policies:     $branch_policies,
                work_items:          $work_items,
                wiki_repos:          $wiki_repos,
                agent_pools:         $agent_pools
              }
            }' > "$DOCS_DIR/backup-manifest.json"

          # Copy wiki-repos.json to docs/ so portal can display wiki names
          # (wiki names are not sensitive — anyone with ADO access knows them)
          cp "$BACKUP_DIR/wiki-repos.json" "$DOCS_DIR/wiki-repos.json"

          echo "Manifest written."
          cat "$DOCS_DIR/backup-manifest.json"

      - name: Write step summary
        run: |
          TOTAL=$(( ${BUILD_PIPELINE_COUNT:-0} + ${RELEASE_PIPELINE_COUNT:-0} + ${VARIABLE_GROUP_COUNT:-0} + ${SERVICE_CONNECTION_COUNT:-0} + ${ENVIRONMENT_COUNT:-0} + ${DASHBOARD_COUNT:-0} + ${BRANCH_POLICY_COUNT:-0} + ${WORK_ITEM_COUNT:-0} + ${WIKI_COUNT:-0} + ${AGENT_POOL_COUNT:-0} ))
          {
            echo "## DR Config Backup — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Org:** \`$ADO_ORG\` | **Project:** \`$ADO_PROJECT\` | **Total items:** $TOTAL"
            echo ""
            echo "| Component | Backed Up | Notes |"
            echo "|-----------|:---------:|-------|"
            echo "| Build Pipelines | **$BUILD_PIPELINE_COUNT** | Classic + YAML pipeline settings |"
            echo "| Release Pipelines | **$RELEASE_PIPELINE_COUNT** | |"
            echo "| Variable Groups | **$VARIABLE_GROUP_COUNT** | ⚠️ Secret values masked by ADO |"
            echo "| Service Connections | **$SERVICE_CONNECTION_COUNT** | ⚠️ Credentials excluded by ADO |"
            echo "| Environments | **$ENVIRONMENT_COUNT** | |"
            echo "| Dashboards | **$DASHBOARD_COUNT** | |"
            echo "| Branch Policies | **$BRANCH_POLICY_COUNT** | |"
            echo "| Work Items | **$WORK_ITEM_COUNT** | All types, key fields |"
            echo "| Wiki Repos | **$WIKI_COUNT** | Content mirrored to GitHub |"
            echo "| Agent Pools (org) | **$AGENT_POOL_COUNT** | |"
            echo ""
            echo "**Files:** \`dr-config-backup/$ADO_ORG/$ADO_PROJECT/\`"
            echo ""
            if [ "$WIKI_COUNT" -gt "0" ]; then
              echo "### Wiki Content Mirror"
              echo "Each wiki is backed up as a private GitHub repo named \`{wiki-name}_backup\`."
              echo ""
              echo -e "$WIKI_MIRROR_RESULTS"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push backup files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dr-config-backup/" "docs/dr-config-backup/"
          if git diff --cached --quiet; then
            echo "No changes to configuration backup — nothing to commit."
          else
            git commit -m "chore(dr): backup ADO config — $ADO_ORG/$ADO_PROJECT [${{ github.actor }}]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Configuration backup committed and pushed."
          fi
