name: DR - Restore Drill (Mock Restore to ADO)

# PURPOSE: Performs a mock DR restoration from GitHub backup repos into
#          NEW isolated Azure DevOps repos. Never overwrites existing repos.
#          Run this periodically to prove your backups are actually restorable.
#
# SAFE BY DESIGN:
#   - Refuses to run if the restore target repo already exists in ADO.
#   - Restores into a separate ADO project (recommended) or same project with suffix.
#   - Does NOT touch original source repos.
#
# USAGE:
#   1. Run workflow_dispatch and fill in the inputs.
#   2. Review the run summary for per-repo parity results.
#   3. Manually inspect the restored ADO repo and then delete it when done.

on:
  workflow_dispatch:
    inputs:
      repos_to_restore:
        description: |
          Comma-separated ado_repo names to restore (e.g. selfhost,hostedagent).
          Required — leaving this blank will abort the workflow.
        required: true
        type: string
      target_ado_org:
        description: Azure DevOps organization to restore into
        required: true
        default: 'binhsps'
        type: string
      target_ado_project:
        description: |
          ADO project to restore into. Use a dedicated DR-Test project to stay
          fully isolated from production repos.
        required: true
        default: 'Test1-DR'
        type: string
      restore_suffix:
        description: |
          Suffix appended to each restored repo name to avoid collision.
          Example: _dr_restore results in selfhost_dr_restore
        required: true
        default: '_dr_restore'
        type: string
      restore_as_of:
        description: |
          Optional point-in-time restore: YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ.
          Each branch is rewound to its latest commit on or before this date.
          Tags whose commit falls after this date are excluded.
          Leave blank to restore to the latest backed-up state.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: dr-restore-drill
  cancel-in-progress: false   # Never cancel a restore in progress

jobs:
  # ── Build the restore matrix ──────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build restore matrix
        id: build
        env:
          REPOS_INPUT: ${{ github.event.inputs.repos_to_restore }}
        run: |
          if [ -z "$REPOS_INPUT" ]; then
            echo "ERROR: repos_to_restore is required. Specify at least one repo name."
            exit 1
          fi

          FILTER=$(printf '%s' "$REPOS_INPUT" \
            | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
          ALL=$(jq -c '[.[] | select((has("enabled") | not) or (.enabled == true))]' repos.json)
          MATRIX=$(jq -cn \
            --argjson all    "$ALL" \
            --argjson filter "$FILTER" \
            '$all | map(select(.ado_repo as $r | $filter | any(. == $r)))')

          COUNT=$(echo "$MATRIX" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No repos matched. Check repos.json and input."
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Repos queued for restore drill: $COUNT"

          {
            echo "## DR Restore Drill — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Target ADO Org | \`${{ github.event.inputs.target_ado_org }}\` |"
            echo "| Target ADO Project | \`${{ github.event.inputs.target_ado_project }}\` |"
            echo "| Restore suffix | \`${{ github.event.inputs.restore_suffix }}\` |"
            ASOF="${{ github.event.inputs.restore_as_of }}"
            if [ -n "$ASOF" ]; then
              echo "| **Restore as-of** | \`$ASOF\` ⏱️ point-in-time |"
            else
              echo "| Restore as-of | Latest backup (no date filter) |"
            fi
            echo "| Triggered by | \`${{ github.actor }}\` |"
            echo ""
            echo "**Repos selected ($COUNT):**"
            echo "$MATRIX" | jq -r '.[] | "- `" + .ado_repo + "`"'
            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Per-repo: create isolated ADO repo, restore, verify ──────────────────
  restore:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false      # Attempt all repos even if one fails

    steps:
      - name: Set names for this restore
        run: |
          RESTORE_REPO="${{ matrix.repo.ado_repo }}${{ github.event.inputs.restore_suffix }}"
          BACKUP_REPO="${{ matrix.repo.ado_repo }}_backup"
          echo "RESTORE_REPO=$RESTORE_REPO" >> "$GITHUB_ENV"
          echo "BACKUP_REPO=$BACKUP_REPO"   >> "$GITHUB_ENV"
          echo "Backup source : $BACKUP_REPO (GitHub)"
          echo "Restore target: $RESTORE_REPO (ADO)"

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.ADO_PAT }}" ]; then echo "ERROR: ADO_PAT missing"; exit 1; fi
          if [ -z "${{ secrets.GH_PAT }}" ];  then echo "ERROR: GH_PAT missing";  exit 1; fi
          echo "Secrets OK."

      - name: URL-encode org and project for API/git URLs
        env:
          TARGET_ORG:     ${{ github.event.inputs.target_ado_org }}
          TARGET_PROJECT: ${{ github.event.inputs.target_ado_project }}
        run: |
          # Encode once here and export so every subsequent step gets correct URLs
          ORG_ENC=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['TARGET_ORG'], safe=''))")
          PROJ_ENC=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['TARGET_PROJECT'], safe=''))")
          echo "TARGET_ORG_ENC=$ORG_ENC"     >> "$GITHUB_ENV"
          echo "TARGET_PROJECT_ENC=$PROJ_ENC" >> "$GITHUB_ENV"
          echo "Encoded: '${{ github.event.inputs.target_ado_org }}' → '$ORG_ENC'"
          echo "Encoded: '${{ github.event.inputs.target_ado_project }}' → '$PROJ_ENC'"

      - name: Safety check — refuse if restore target already exists
        env:
          ADO_PAT:        ${{ secrets.ADO_PAT }}
          TARGET_ORG:     ${{ github.event.inputs.target_ado_org }}
          TARGET_PROJECT: ${{ github.event.inputs.target_ado_project }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o /dev/null \
            -u ":$ADO_PAT" \
            "https://dev.azure.com/$TARGET_ORG_ENC/$TARGET_PROJECT_ENC/_apis/git/repositories/$RESTORE_REPO?api-version=7.1-preview.1")

          if [ "$HTTP" = "200" ]; then
            echo "ERROR: '$RESTORE_REPO' already exists in $TARGET_ORG/$TARGET_PROJECT."
            echo "Choose a different --restore_suffix or delete the existing repo first."
            exit 1
          fi

          echo "Safety check passed — '$RESTORE_REPO' does not exist yet."

      - name: Create isolated ADO repo
        env:
          ADO_PAT:        ${{ secrets.ADO_PAT }}
          TARGET_ORG:     ${{ github.event.inputs.target_ado_org }}
          TARGET_PROJECT: ${{ github.event.inputs.target_ado_project }}
        run: |
          HTTP=$(curl -sS -w "%{http_code}" -o create-resp.json \
            -X POST \
            -u ":$ADO_PAT" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$RESTORE_REPO\"}" \
            "https://dev.azure.com/$TARGET_ORG_ENC/$TARGET_PROJECT_ENC/_apis/git/repositories?api-version=7.1-preview.1")

          if [ "$HTTP" != "201" ]; then
            echo "ERROR: Failed to create ADO repo (HTTP $HTTP)"
            cat create-resp.json
            exit 1
          fi

          echo "Created: $RESTORE_REPO in $TARGET_ORG/$TARGET_PROJECT"

      - name: Clone from GitHub backup
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --mirror \
            "https://x-access-token:$GH_PAT@github.com/${{ github.repository_owner }}/${BACKUP_REPO}.git" \
            restore-mirror

          echo "Cloned $BACKUP_REPO — refs:"
          git -C restore-mirror for-each-ref --format='%(refname)' refs/heads refs/tags | head -30

      - name: Rewind refs to point-in-time (restore_as_of)
        if: ${{ github.event.inputs.restore_as_of != '' }}
        run: |
          RESTORE_DATE="${{ github.event.inputs.restore_as_of }}"
          # Normalise: accept YYYY-MM-DD or ISO-8601; git/date both handle it fine
          CUTOFF="${RESTORE_DATE}T23:59:59Z"
          echo "Point-in-time restore — rewinding all refs to: $CUTOFF"
          echo ""

          # ── Rewind branches ───────────────────────────────────────────────
          KEPT_BRANCHES=0
          DROPPED_BRANCHES=0
          while IFS= read -r REF; do
            BRANCH="${REF#refs/heads/}"
            AS_OF=$(git -C restore-mirror rev-list "$REF" \
              --before="$CUTOFF" --max-count=1 2>/dev/null || true)

            if [ -z "$AS_OF" ]; then
              echo "  DROP branch '$BRANCH' — no commits before $CUTOFF"
              git -C restore-mirror update-ref -d "$REF"
              DROPPED_BRANCHES=$((DROPPED_BRANCHES + 1))
            else
              COMMIT_TIME=$(git -C restore-mirror log --format='%ai' -1 "$AS_OF")
              echo "  KEEP branch '$BRANCH' → ${AS_OF:0:10} ($COMMIT_TIME)"
              git -C restore-mirror update-ref "$REF" "$AS_OF"
              KEPT_BRANCHES=$((KEPT_BRANCHES + 1))
            fi
          done < <(git -C restore-mirror for-each-ref --format='%(refname)' refs/heads)

          if [ "$KEPT_BRANCHES" -eq 0 ]; then
            echo ""
            echo "ERROR: No branches have any commits on or before $RESTORE_DATE."
            echo "       The earliest commit in this repo may be after the requested date."
            exit 1
          fi

          # ── Remove tags whose commit falls after the cutoff ───────────────
          KEPT_TAGS=0
          DROPPED_TAGS=0
          while IFS= read -r TAG_REF; do
            TAG="${TAG_REF#refs/tags/}"
            # Dereference annotated tags to the underlying commit
            TAG_COMMIT=$(git -C restore-mirror rev-list -1 "${TAG_REF}^{}" -- 2>/dev/null \
              || git -C restore-mirror rev-list -1 "$TAG_REF" -- 2>/dev/null || true)

            if [ -z "$TAG_COMMIT" ]; then
              KEPT_TAGS=$((KEPT_TAGS + 1))
              continue
            fi

            COMMIT_EPOCH=$(git -C restore-mirror log --format='%ct' -1 "$TAG_COMMIT")
            CUTOFF_EPOCH=$(date -d "$CUTOFF" +%s)

            if [ "$COMMIT_EPOCH" -gt "$CUTOFF_EPOCH" ]; then
              echo "  DROP tag '$TAG' — commit $(date -d "@$COMMIT_EPOCH" '+%Y-%m-%d') is after cutoff"
              git -C restore-mirror update-ref -d "$TAG_REF"
              DROPPED_TAGS=$((DROPPED_TAGS + 1))
            else
              echo "  KEEP tag '$TAG'"
              KEPT_TAGS=$((KEPT_TAGS + 1))
            fi
          done < <(git -C restore-mirror for-each-ref --format='%(refname)' refs/tags)

          echo ""
          echo "Result: kept $KEPT_BRANCHES branches (dropped $DROPPED_BRANCHES), kept $KEPT_TAGS tags (dropped $DROPPED_TAGS)"
          echo "RESTORE_DATE=$RESTORE_DATE" >> "$GITHUB_ENV"

      - name: Push to isolated ADO restore target
        env:
          ADO_PAT:        ${{ secrets.ADO_PAT }}
          TARGET_ORG:     ${{ github.event.inputs.target_ado_org }}
          TARGET_PROJECT: ${{ github.event.inputs.target_ado_project }}
        run: |
          cd restore-mirror
          git push --force \
            "https://:$ADO_PAT@dev.azure.com/$TARGET_ORG_ENC/$TARGET_PROJECT_ENC/_git/$RESTORE_REPO" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          echo "Push complete → https://dev.azure.com/$TARGET_ORG/$TARGET_PROJECT/_git/$RESTORE_REPO"

      - name: Verify restoration (parity check)
        env:
          ADO_PAT:        ${{ secrets.ADO_PAT }}
          TARGET_ORG:     ${{ github.event.inputs.target_ado_org }}
          TARGET_PROJECT: ${{ github.event.inputs.target_ado_project }}
        run: |
          # ── Counts from GitHub backup (local mirror) ──
          GH_BRANCHES=$(git -C restore-mirror for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')
          GH_TAGS=$(    git -C restore-mirror for-each-ref --format='%(refname)' refs/tags  | wc -l | tr -d ' ')
          GH_HEAD=$(    git -C restore-mirror rev-parse refs/heads/main 2>/dev/null \
                        || git -C restore-mirror for-each-ref --format='%(objectname)' refs/heads \
                           | head -1)

          # ── Counts from ADO restore target (live remote) ──
          # Use a single variable for the remote URL (encoded) to avoid repetition
          ADO_REMOTE="https://:$ADO_PAT@dev.azure.com/$TARGET_ORG_ENC/$TARGET_PROJECT_ENC/_git/$RESTORE_REPO"
          ADO_BRANCHES=$(git ls-remote --heads "$ADO_REMOTE" | wc -l | tr -d ' ')
          ADO_TAGS=$(git ls-remote --tags "$ADO_REMOTE" | grep -v '\^{}' | wc -l | tr -d ' ')
          ADO_HEAD=$(git ls-remote "$ADO_REMOTE" refs/heads/main 2>/dev/null | awk '{print $1}' \
            || git ls-remote "$ADO_REMOTE" | head -1 | awk '{print $1}')

          echo "GitHub backup  — branches: $GH_BRANCHES, tags: $GH_TAGS, head: ${GH_HEAD:0:10}"
          echo "ADO restore    — branches: $ADO_BRANCHES, tags: $ADO_TAGS, head: ${ADO_HEAD:0:10}"

          PASS=true
          NOTES=""
          [ "$GH_BRANCHES" != "$ADO_BRANCHES" ] && { PASS=false; NOTES="$NOTES Branch count mismatch ($GH_BRANCHES vs $ADO_BRANCHES)."; }
          [ "$GH_TAGS"     != "$ADO_TAGS"     ] && { PASS=false; NOTES="$NOTES Tag count mismatch ($GH_TAGS vs $ADO_TAGS)."; }
          [ -n "$GH_HEAD" ] && [ -n "$ADO_HEAD" ] && [ "$GH_HEAD" != "$ADO_HEAD" ] \
            && { PASS=false; NOTES="$NOTES HEAD commit mismatch."; }

          ADO_URL="https://dev.azure.com/$TARGET_ORG/$TARGET_PROJECT/_git/$RESTORE_REPO"

          if [ "$PASS" = "true" ]; then
            RESULT="✅ PASSED"
            echo "VERIFICATION PASSED"
          else
            RESULT="❌ FAILED — $NOTES"
            echo "VERIFICATION FAILED: $NOTES"
          fi

          {
            echo "### \`${{ matrix.repo.ado_repo }}\` → \`$RESTORE_REPO\`"
            echo ""
            if [ -n "$RESTORE_DATE" ]; then
              echo "> ⏱️ Point-in-time restore — branches rewound to **$RESTORE_DATE**"
              echo ""
            fi
            echo "| Metric | GitHub Backup | ADO Restore |"
            echo "|--------|:-------------:|:-----------:|"
            echo "| Branches | $GH_BRANCHES | $ADO_BRANCHES |"
            echo "| Tags | $GH_TAGS | $ADO_TAGS |"
            echo "| HEAD commit | \`${GH_HEAD:0:10}\` | \`${ADO_HEAD:0:10}\` |"
            echo "| **Verification** | | **$RESULT** |"
            echo ""
            echo "**Restore URL:** [$ADO_URL]($ADO_URL)"
            echo ""
            echo "> ⚠️ Delete this isolated repo when the drill is complete."
            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$PASS" = "true" ] || exit 1
