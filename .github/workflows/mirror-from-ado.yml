name: Mirror ADO Repos to GitHub

on:
  schedule:
    - cron: '0 18 * * *'   # Daily at 6 PM UTC
  workflow_dispatch:
    inputs:
      ado_org:
        description: Azure DevOps organization name
        required: true
        default: 'binhsps'
        type: string
      ado_project:
        description: Azure DevOps project name
        required: true
        default: 'Test1'
        type: string
      repos_to_mirror:
        description: |
          Comma-separated ado_repo names to persist as the mirror set (example: selfhost,hostedagent).
          Repositories are validated against the live Azure DevOps repo list.
          Leave blank to only display available repos.
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  load-repos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout workflow-hub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch available repos from Azure DevOps
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ADO_ORG: ${{ github.event.inputs.ado_org }}
          ADO_PROJECT: ${{ github.event.inputs.ado_project }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          if [ -z "$ADO_PAT" ]; then
            echo "ERROR: ADO_PAT secret is missing"
            exit 1
          fi

          curl -sS -u ":$ADO_PAT" \
            "https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis/git/repositories?api-version=7.1-preview.1" \
            > ado-repos-raw.json

          jq -r '.value | map(.name) | sort | unique' ado-repos-raw.json > ado-repos.json

          echo "Available repositories from Azure DevOps ($ADO_ORG/$ADO_PROJECT):"
          jq -r '.[]' ado-repos.json | nl -ba

          if [ "$(jq 'length' ado-repos.json)" -eq 0 ]; then
            echo "ERROR: No repositories found in Azure DevOps project."
            exit 1
          fi

      - name: Persist selected repos to repos.json
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repos_to_mirror != '' }}
        env:
          ADO_ORG: ${{ github.event.inputs.ado_org }}
          ADO_PROJECT: ${{ github.event.inputs.ado_project }}
          REPOS_TO_MIRROR: ${{ github.event.inputs.repos_to_mirror }}
        run: |
          echo "Requested repos: $REPOS_TO_MIRROR"

          SELECTED=$(printf '%s' "$REPOS_TO_MIRROR" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0)) | unique')
          if [ "$(echo "$SELECTED" | jq 'length')" -eq 0 ]; then
            echo "ERROR: repos_to_mirror is empty after parsing."
            exit 1
          fi

          UNKNOWN=$(jq -n --argjson selected "$SELECTED" --slurpfile available ado-repos.json '$selected - $available[0]')
          if [ "$(echo "$UNKNOWN" | jq 'length')" -gt 0 ]; then
            echo "ERROR: Unknown repos in selection: $(echo "$UNKNOWN" | jq -r 'join(", ")')"
            echo "Allowed repos are:"
            jq -r '.[]' ado-repos.json
            exit 1
          fi

          jq -n --arg org "$ADO_ORG" --arg project "$ADO_PROJECT" --argjson selected "$SELECTED" '
            $selected | map({
              ado_org: $org,
              ado_project: $project,
              ado_repo: .,
              enabled: true
            })
          ' > repos.json.tmp
          mv repos.json.tmp repos.json

          echo "Updated repos.json selection:"
          jq -r '.[] | "- \(.ado_repo): enabled=\(.enabled)"' repos.json

          if git diff --quiet -- repos.json; then
            echo "No repos.json changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repos.json
            git commit -m "chore: update mirrored repo selection"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "repos.json committed and pushed."
          fi

      - name: Load repo list from repos.json
        id: set-matrix
        run: |
          MATRIX=$(jq -c '[ .[] | select((has("enabled") | not) or (.enabled == true)) ]' repos.json)
          if [ "$(echo "$MATRIX" | jq 'length')" -eq 0 ]; then
            echo "ERROR: No repos selected to mirror."
            echo "Use workflow_dispatch input repos_to_mirror to set selection."
            exit 1
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Total repos to mirror: $(echo "$MATRIX" | jq length)"

  mirror:
    needs: load-repos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.load-repos.outputs.matrix) }}
      fail-fast: false   # Continue mirroring other repos even if one fails

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.ADO_PAT }}" ]; then echo "ERROR: ADO_PAT secret is missing"; exit 1; fi
          if [ -z "${{ secrets.GH_PAT }}" ];  then echo "ERROR: GH_PAT secret is missing";  exit 1; fi
          echo "All secrets present."

      - name: Create GitHub backup repo (if not exists)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BACKUP_REPO="${{ matrix.repo.ado_repo }}_backup"
          echo "BACKUP_REPO=$BACKUP_REPO" >> $GITHUB_ENV
          gh repo create "${{ github.repository_owner }}/$BACKUP_REPO" \
            --private \
            --description "Mirror of ADO: ${{ matrix.repo.ado_org }}/${{ matrix.repo.ado_project }}/${{ matrix.repo.ado_repo }}" \
          && echo "Repo $BACKUP_REPO created." \
          || echo "Repo $BACKUP_REPO already exists, syncing..."

      - name: Clone from Azure DevOps (mirror)
        run: |
          git clone --mirror \
            "https://${{ secrets.ADO_PAT }}@dev.azure.com/${{ matrix.repo.ado_org }}/${{ matrix.repo.ado_project }}/_git/${{ matrix.repo.ado_repo }}" \
            ado-mirror
          echo "Refs cloned:"
          git -C ado-mirror for-each-ref --format='%(refname)' refs/heads refs/tags | head -20

      - name: Strip large files from history (>100MB)
        run: |
          pip install git-filter-repo --quiet
          cd ado-mirror && git filter-repo --strip-blobs-bigger-than 100M --force
          echo "Large blobs stripped."

      - name: Push to GitHub backup repo
        run: |
          cd ado-mirror
          BACKUP_REPO="${{ matrix.repo.ado_repo }}_backup"
          git push --force --prune \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/${BACKUP_REPO}.git" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
          echo "Done -> github.com/${{ github.repository_owner }}/${BACKUP_REPO}"

  notify-on-failure:
    needs: [load-repos, mirror]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Build alert payload
        id: payload
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ALERT_TEXT="DR mirror workflow FAILED\nRepository: ${{ github.repository }}\nBranch/Ref: ${{ github.ref_name }}\nActor: ${{ github.actor }}\nRun: $RUN_URL"
          PAYLOAD=$(jq -cn --arg text "$ALERT_TEXT" '{text: $text}')
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"
          {
            echo "## DR Mirror Failure Alert"
            echo "- Repository: ${{ github.repository }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Actor: ${{ github.actor }}"
            echo "- Run URL: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send webhook alert (if configured)
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.payload.outputs.payload }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -sS -X POST "$ALERT_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD"
            echo "Failure alert sent to configured webhook."
          else
            echo "ALERT_WEBHOOK_URL secret is not configured; skipping external notification."
          fi

